[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: tests that take >1s (network, real DB, etc.)
    integration: tests that hit external services (skip in CI without network)
